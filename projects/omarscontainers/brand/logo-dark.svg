<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="omarscontainers">
  <title>omarscontainers</title>
  <defs>
    <clipPath id="cd"><rect x="14" y="30" width="76" height="60" rx="4"/></clipPath>
  </defs>

  <!-- Container mark in cargo orange: 5.90:1 on black, and it carries the brand
       action colour so the mark reads as the focal point rather than the text. -->
  <g clip-path="url(#cd)">
    <rect x="14" y="30" width="76" height="60" fill="#EA580C"/>
    <!-- corrugation ribs, darkened rather than lightened so they read on orange -->
    <g fill="#000000" opacity="0.17">
      <rect x="20" y="30" width="4" height="60"/>
      <rect x="30" y="30" width="4" height="60"/>
      <rect x="40" y="30" width="4" height="60"/>
      <rect x="50" y="30" width="4" height="60"/>
      <rect x="60" y="30" width="4" height="60"/>
      <rect x="70" y="30" width="4" height="60"/>
      <rect x="80" y="30" width="4" height="60"/>
    </g>
    <!-- top and bottom rails -->
    <rect x="14" y="30" width="76" height="7" fill="#B4400B"/>
    <rect x="14" y="83" width="76" height="7" fill="#B4400B"/>
  </g>
  <rect x="14" y="30" width="76" height="60" rx="4" fill="none" stroke="#F97316" stroke-width="1.5"/>

  <!-- Wordmark: 20.07:1 and 14.14:1 on black -->
  <!-- Single text element with tspans: the browser advances x automatically,
       so the two weights cannot collide the way manual positioning did. -->
  <text y="66" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="38" letter-spacing="-0.6">
    <tspan x="108" font-weight="700" fill="#F8FAFC">omars</tspan><tspan font-weight="300" fill="#CBD5E1">containers</tspan>
  </text>

  <text x="110" y="90"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="13" font-weight="500" letter-spacing="2.6" fill="#94A3B8">ESSEN &#183; NEUWARE</text>
</svg>
