/* ---------- TRUE EDGE-TO-EDGE on homepage (CSS half; JS finishes the job) ---------- */
.home .sidebar-page-container,.page-id-128 .sidebar-page-container{padding:0 !important;}
.home .auto-container,.page-id-128 .auto-container,
.home .row,.page-id-128 .row,
.home .content-side,.page-id-128 .content-side,
.home .blog-details-content,.page-id-128 .blog-details-content,
.home .outer-container,.page-id-128 .outer-container{
  max-width:none !important;width:100% !important;
  padding-left:0 !important;padding-right:0 !important;
  margin-left:0 !important;margin-right:0 !important;}
.kc-home{width:100% !important;max-width:none !important;}
.kc-home section{width:100% !important;max-width:none !important;left:auto !important;right:auto !important;margin:0 !important;}
.kc-home .kc-wrap{max-width:1200px;margin-inline:auto;padding-inline:24px;}

/* ================= COOL BACKGROUNDS ================= */
/* hero: corten glow + steel gradient + container corrugation */
.kc-hero{position:relative;overflow:hidden;border-radius:0 !important;
 background:radial-gradient(1100px 520px at 12% 8%,rgba(194,82,42,.30),transparent 62%),
            radial-gradient(900px 480px at 92% 100%,rgba(58,86,110,.40),transparent 60%),
            linear-gradient(135deg,#26323C 0%,#12171B 100%) !important;}
.kc-hero:before{content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 2px,transparent 2px 46px);opacity:1;}
.kc-hero:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);}
.kc-hero .kc-wrap{position:relative;z-index:2;}

/* blueprint grid on light sections */
.kc-home section:nth-of-type(2),.kc-home section:nth-of-type(7){
 background-color:var(--kc-paper) !important;
 background-image:linear-gradient(rgba(38,50,60,.055) 1px,transparent 1px),
                  linear-gradient(90deg,rgba(38,50,60,.055) 1px,transparent 1px);
 background-size:34px 34px;}

/* white product sections with hairlines */
.kc-home section:nth-of-type(3),.kc-home section:nth-of-type(6),.kc-home section:nth-of-type(10){
 background:#fff !important;border-top:1px solid var(--kc-line);border-bottom:1px solid var(--kc-line);}

/* diagonal hatch for the used-container collection */
.kc-home section:nth-of-type(5){
 background-color:#EEF1F3 !important;
 background-image:repeating-linear-gradient(45deg,rgba(38,50,60,.05) 0 2px,transparent 2px 14px);}

/* dark store band: corrugated steel */
.kc-band{position:relative;overflow:hidden;border-radius:0 !important;
 background:linear-gradient(135deg,#26323C 0%,#171D23 100%) !important;}
.kc-band:before{content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 44px);}
.kc-band .kc-wrap{position:relative;z-index:1;}

/* FAQ soft radial */
.kc-faq{background:
 radial-gradient(700px 320px at 80% 0%,rgba(194,82,42,.07),transparent 62%),var(--kc-paper) !important;}

/* category cards lift */
.kc-cat{background:#fff;border:1px solid var(--kc-line);border-radius:var(--kc-radius);
 transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease;}
.kc-cat:hover{box-shadow:0 10px 28px rgba(26,29,33,.12);transform:translateY(-3px);border-color:#C9CFD4;}

/* ---------- footer full-bleed ---------- */
html,body{overflow-x:hidden;}
.kc-footer{width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;max-width:100vw;
 background:linear-gradient(180deg,#26323C 0%,#1B2229 100%) !important;}
.kc-footer .kc-container{max-width:1280px;margin-inline:auto;padding-inline:24px;}

/* ---------- buttons / forms / product cards ---------- */
.button,button,.woocommerce a.button,.woocommerce button.button,.woocommerce input.button,.woocommerce #respond input#submit{
 background:var(--kc-corten);color:#fff;border:1px solid var(--kc-corten);border-radius:var(--kc-radius);font-weight:600;transition:background .18s ease;}
.button:hover,.woocommerce a.button:hover,.woocommerce button.button:hover{background:var(--kc-corten7);border-color:var(--kc-corten7);color:#fff;}
.woocommerce .price,.woocommerce span.price{color:var(--kc-corten);font-weight:700;}
.woocommerce ul.products li.product{background:#fff;border:1px solid var(--kc-line);border-radius:var(--kc-radius);padding:12px;transition:box-shadow .2s ease,transform .2s ease;}
.woocommerce ul.products li.product:hover{box-shadow:0 10px 28px rgba(26,29,33,.12);transform:translateY(-3px);}
:focus-visible{outline:2px solid var(--kc-corten);outline-offset:2px;}
input:focus,textarea:focus,select:focus{border-color:var(--kc-corten);box-shadow:0 0 0 3px rgba(194,82,42,.18);outline:none;}

/* remove theme demo contact bar (fake +357 phone, dead mailto:#) */
.header-top-two,.header-top-one,.header-top{display:none !important;}

/* ================= VISUAL UPGRADE + MOTION ================= */

/* HERO: real container photo + steel wash + corten glow + corrugation */
.kc-hero{position:relative;overflow:hidden;
 background-image:
   linear-gradient(120deg,rgba(18,23,27,.94) 0%,rgba(26,40,52,.86) 45%,rgba(18,23,27,.72) 100%),
   url("https://kaisercontainers.de/wp-content/uploads/2026/08/20-Fuss-Seecontainer-RAL-7016.jpg") !important;
 background-size:cover,cover !important;
 background-position:center,center right !important;}
.kc-hero:before{content:"";position:absolute;inset:0;z-index:0;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.075) 0 2px,transparent 2px 44px);}
/* slow drifting corten glow */
.kc-hero:after{content:"";position:absolute;inset:-20%;z-index:0;pointer-events:none;
 background:radial-gradient(closest-side,rgba(194,82,42,.42),transparent 70%);
 animation:kcDrift 22s ease-in-out infinite alternate;}
.kc-hero .kc-wrap{position:relative;z-index:2;}
@keyframes kcDrift{0%{transform:translate3d(-12%,-8%,0) scale(1);}100%{transform:translate3d(14%,10%,0) scale(1.15);}}

/* BLUEPRINT GRID - stronger, with major/minor lines */
.kc-home section:nth-of-type(2),.kc-home section:nth-of-type(7){
 background-color:#EEF1F4 !important;
 background-image:
  linear-gradient(rgba(38,50,60,.10) 1px,transparent 1px),
  linear-gradient(90deg,rgba(38,50,60,.10) 1px,transparent 1px),
  linear-gradient(rgba(38,50,60,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(38,50,60,.05) 1px,transparent 1px) !important;
 background-size:120px 120px,120px 120px,24px 24px,24px 24px !important;}

/* DIAGONAL HATCH - stronger */
.kc-home section:nth-of-type(5){
 background-color:#E7EBEE !important;
 background-image:repeating-linear-gradient(45deg,rgba(38,50,60,.10) 0 3px,transparent 3px 16px) !important;}

/* DARK BAND: corrugated steel + corten edge */
.kc-band{position:relative;overflow:hidden;
 background:linear-gradient(135deg,#26323C 0%,#12181D 100%) !important;
 border-top:3px solid var(--kc-corten);}
.kc-band:before{content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 42px);}
.kc-band .kc-wrap{position:relative;z-index:1;}

/* FAQ glow */
.kc-faq{background:
 radial-gradient(760px 340px at 82% 0%,rgba(194,82,42,.12),transparent 62%),#F2F4F6 !important;}

/* ---------------- MOTION ---------------- */
@media (prefers-reduced-motion: no-preference){
  .kc-rv{opacity:0;transform:translate3d(0,22px,0);
         transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);
         transition-delay:var(--d,0ms);}
  .kc-rv.is-in{opacity:1;transform:none;}
  .kc-hero .kc-wrap>*{animation:kcUp .8s cubic-bezier(.16,1,.3,1) both;}
  .kc-hero .kc-wrap>*:nth-child(1){animation-delay:.05s}
  .kc-hero .kc-wrap>*:nth-child(2){animation-delay:.15s}
  .kc-hero .kc-wrap>*:nth-child(3){animation-delay:.25s}
  .kc-hero .kc-wrap>*:nth-child(4){animation-delay:.35s}
  .kc-hero .kc-wrap>*:nth-child(5){animation-delay:.45s}
  @keyframes kcUp{from{opacity:0;transform:translate3d(0,26px,0)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion: reduce){
  .kc-rv{opacity:1 !important;transform:none !important;}
  .kc-hero:after{animation:none !important;}
}

/* micro-interactions */
.kc-cat,.woocommerce ul.products li.product{
 transition:transform .28s cubic-bezier(.16,1,.3,1),box-shadow .28s cubic-bezier(.16,1,.3,1),border-color .28s ease;}
.kc-cat:hover,.woocommerce ul.products li.product:hover{
 transform:translateY(-6px);box-shadow:0 16px 40px rgba(26,29,33,.16);border-color:var(--kc-corten);}
.kc-cat .kc-ico{transition:transform .28s cubic-bezier(.16,1,.3,1);}
.kc-cat:hover .kc-ico{transform:scale(1.12) rotate(-3deg);}
.kc-btn,.button,.woocommerce a.button{transition:background .2s ease,transform .18s ease,box-shadow .2s ease;}
.kc-btn:hover,.button:hover,.woocommerce a.button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(194,82,42,.32);}
.kc-btn:active,.button:active{transform:translateY(0);}
.woocommerce ul.products li.product img{transition:transform .4s cubic-bezier(.16,1,.3,1);}
.woocommerce ul.products li.product:hover img{transform:scale(1.05);}

/* sticky header condense */
.main-header.kc-stuck{position:sticky;top:0;z-index:999;box-shadow:0 6px 24px rgba(26,29,33,.16);
 backdrop-filter:saturate(140%) blur(2px);transition:box-shadow .25s ease;}

/* ===== CORRECTION: section mapping was off by one; store-info band (with the
   Google Map) had a light bg but white text. Make that section light + BLACK text. ===== */
.kc-home section:nth-of-type(7),.kc-band{
 background:#EEF1F4 !important;
 background-image:
  linear-gradient(rgba(38,50,60,.10) 1px,transparent 1px),
  linear-gradient(90deg,rgba(38,50,60,.10) 1px,transparent 1px),
  linear-gradient(rgba(38,50,60,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(38,50,60,.05) 1px,transparent 1px) !important;
 background-size:120px 120px,120px 120px,24px 24px,24px 24px !important;
 border-top:3px solid var(--kc-corten);}
.kc-band:before{display:none !important;}
.kc-band,.kc-band *,.kc-band h2,.kc-band h3,.kc-band p,.kc-band li,.kc-band strong,.kc-band span{
 color:var(--kc-ink) !important;}
.kc-band a{color:var(--kc-corten) !important;text-decoration:underline;}
.kc-band a.kc-btn{color:#fff !important;text-decoration:none;background:var(--kc-corten) !important;}
.kc-band .kc-store-list li{border-bottom:1px solid rgba(38,50,60,.18) !important;}

/* correct the remaining section backgrounds for the real order */
.kc-home section:nth-of-type(4){
 background-color:#E7EBEE !important;
 background-image:repeating-linear-gradient(45deg,rgba(38,50,60,.10) 0 3px,transparent 3px 16px) !important;}
.kc-home section:nth-of-type(5){background:#fff !important;background-image:none !important;}
.kc-home section:nth-of-type(9){background:#fff !important;background-image:none !important;}

/* ===== CONTACT FORM: make fields clearly visible ===== */
.wpcf7{background:#fff;border:1px solid var(--kc-line);border-radius:8px;
 padding:28px;box-shadow:0 2px 10px rgba(26,29,33,.06);max-width:760px;}
.kc-band .wpcf7,.kc-faq .wpcf7{background:#fff;}
.wpcf7-form p{margin:0 0 18px !important;}
.wpcf7-form label{display:block;font-family:"Archivo",sans-serif;font-weight:700;
 color:var(--kc-ink) !important;margin-bottom:6px;font-size:.95rem;}
.wpcf7-form-control-wrap{display:block;margin-top:6px;}
.wpcf7-form input[type="text"],.wpcf7-form input[type="email"],.wpcf7-form input[type="tel"],
.wpcf7-form input[type="url"],.wpcf7-form input[type="number"],.wpcf7-form select,
.wpcf7-form textarea{
 width:100% !important;box-sizing:border-box;
 padding:.85em 1em !important;
 border:1px solid #BFC7CD !important;border-radius:6px !important;
 background:#FDFDFE !important;color:var(--kc-ink) !important;
 font-family:"Inter",sans-serif !important;font-size:1rem !important;line-height:1.4;
 box-shadow:inset 0 1px 2px rgba(26,29,33,.05);transition:border-color .18s ease,box-shadow .18s ease;}
.wpcf7-form textarea{min-height:160px !important;resize:vertical;}
.wpcf7-form input::placeholder,.wpcf7-form textarea::placeholder{color:#7A848C !important;opacity:1;}
.wpcf7-form input:focus,.wpcf7-form select:focus,.wpcf7-form textarea:focus{
 border-color:var(--kc-corten) !important;background:#fff !important;
 box-shadow:0 0 0 3px rgba(194,82,42,.18) !important;outline:none !important;}
.wpcf7-form input[type="submit"]{
 width:auto !important;background:var(--kc-corten) !important;color:#fff !important;
 border:none !important;border-radius:6px !important;padding:.9em 1.9em !important;
 font-family:"Archivo",sans-serif !important;font-weight:700 !important;font-size:1rem !important;
 cursor:pointer;box-shadow:none !important;transition:background .2s ease,transform .18s ease;}
.wpcf7-form input[type="submit"]:hover{background:var(--kc-corten7) !important;transform:translateY(-2px);}
.wpcf7-form .wpcf7-list-item{margin-left:0 !important;}

/* §12 Materials: the sticky header is a real translucent layer, not an opaque strip. */
.main-header.kc-stuck{

 box-shadow:none !important;}
/* §12 Scroll edge effect instead of a hard divider */
.main-header.kc-stuck:after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;
