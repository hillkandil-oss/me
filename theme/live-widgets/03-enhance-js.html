<!-- LIVE widget custom_html-4 -->
<script>
(function(){
 function mk(tag,cls,txt,href){
  var e=document.createElement(tag);
  if(cls){e.className=cls;}
  if(txt){e.appendChild(document.createTextNode(txt));}
  if(href){e.setAttribute("href",href);}
  return e;
 }
 function topbar(){
  var mh=document.querySelector(".main-header");
  if(!mh||document.getElementById("kc-topbar")){return;}
  var bar=mk("div",null,null,null); bar.id="kc-topbar";
  var inner=mk("div","kc-topbar__inner",null,null);
  inner.appendChild(mk("span","kc-topbar__item kc-i-phone","Anrufen: wird ergänzt",null));
  inner.appendChild(mk("a","kc-topbar__item kc-i-mail","info@kaisercontainers.de","mailto:info@kaisercontainers.de"));
  inner.appendChild(mk("span","kc-topbar__item kc-i-clock","Mo–Sa: 08:00–18:30 Uhr",null));
  var dir=mk("a","kc-topbar__item kc-i-pin kc-sep","47138 Duisburg · Route planen","https://maps.app.goo.gl/k4JZCaARe1ZPu5WUA");
  dir.setAttribute("target","_blank"); dir.setAttribute("rel","noopener");
  inner.appendChild(dir);
  bar.appendChild(inner);
  mh.insertBefore(bar,mh.firstChild);
 }
 function shopCta(){
  var list=document.querySelectorAll(".main-header .theme-btn, a.theme-btn-eight");
  for(var i=0;i<list.length;i++){
   var a=list[i];
   var t=(a.textContent||"").toLowerCase();
   if(t.indexOf("sing up")>-1||t.indexOf("sign up")>-1||t.indexOf("sign in")>-1||a.getAttribute("href")==="#"){
    while(a.firstChild){a.removeChild(a.firstChild);}
    a.appendChild(document.createTextNode("Jetzt einkaufen"));
    a.setAttribute("href","/shop/");
   }
  }
 }
 function edgeToEdge(){
  var home=document.querySelector(".kc-home");
  if(!home){return;}
  var el=home.parentElement,guard=0;
  while(el&&el!==document.body&&guard<25){
   guard=guard+1;
   el.style.setProperty("max-width","none","important");
   el.style.setProperty("width","100%","important");
   el.style.setProperty("padding-left","0","important");
   el.style.setProperty("padding-right","0","important");
   el.style.setProperty("margin-left","0","important");
   el.style.setProperty("margin-right","0","important");
   el=el.parentElement;
  }
 }

 function dropDemoBar(){
  var sel=[".header-top-two",".header-top-one",".header-top"];
  for(var s=0;s<sel.length;s++){
   var n=document.querySelectorAll(sel[s]);
   for(var i=0;i<n.length;i++){ if(n[i].parentNode){ n[i].parentNode.removeChild(n[i]); } }
  }
 }

 function reveal(){
  if(!("IntersectionObserver" in window)){return;}
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){return;}
  var sels=[".kc-home section h2",".kc-home .kc-lead",".kc-cat",".kc-benefit",
            ".kc-home .kc-store-list",".kc-faq details",".woocommerce ul.products li.product",
            ".kc-home .kc-photo-slot",".kc-home form"];
  var groups={};
  for(var s=0;s<sels.length;s++){
   var n=document.querySelectorAll(sels[s]);
   for(var i=0;i<n.length;i++){
    if(n[i].classList.contains("kc-rv")){continue;}
    n[i].classList.add("kc-rv");
    var key=sels[s];
    groups[key]=(groups[key]||0)+1;
    n[i].style.setProperty("--d",((groups[key]-1)%6)*70+"ms");
   }
  }
  var io=new IntersectionObserver(function(entries){
   for(var e=0;e<entries.length;e++){
    if(entries[e].isIntersecting){entries[e].target.classList.add("is-in");io.unobserve(entries[e].target);}
   }
  },{threshold:0.12,rootMargin:"0px 0px -40px 0px"});
  var all=document.querySelectorAll(".kc-rv");
  for(var j=0;j<all.length;j++){io.observe(all[j]);}
 }
 function stickyHeader(){
  var mh=document.querySelector(".main-header");
  if(!mh){return;}
  function onScroll(){
   if(window.pageYOffset>240){mh.classList.add("kc-stuck");}else{mh.classList.remove("kc-stuck");}
  }
  window.addEventListener("scroll",onScroll,{passive:true});onScroll();
 }

 function germanForm(){
  var map={"your name":"Vollständiger Name (Pflichtfeld)","your email":"E-Mail-Adresse (Pflichtfeld)",
           "subject":"Betreff (Pflichtfeld)","your message (optional)":"Ihre Nachricht",
           "your message":"Ihre Nachricht"};
  var ph={"your-name":"Max Mustermann","your-email":"name@beispiel.de",
          "your-subject":"Worum geht es?","your-message":"Wie können wir Ihnen helfen?"};
  var labels=document.querySelectorAll(".wpcf7-form label");
  for(var i=0;i<labels.length;i++){
   var lab=labels[i];
   for(var n=0;n<lab.childNodes.length;n++){
    var node=lab.childNodes[n];
    if(node.nodeType===3){
     var key=node.nodeValue.replace(/\s+/g," ").trim().toLowerCase();
     if(map[key]){node.nodeValue=map[key];}
    }
   }
  }
  for(var k in ph){
   var el=document.querySelector('.wpcf7-form [name="'+k+'"]');
   if(el&&!el.getAttribute("placeholder")){el.setAttribute("placeholder",ph[k]);}
  }
  var sub=document.querySelectorAll('.wpcf7-form input[type="submit"]');
  for(var s=0;s<sub.length;s++){
   if((sub[s].value||"").toLowerCase().indexOf("submit")>-1){sub[s].value="Nachricht senden";}
  }
 }
 function run(){germanForm();reveal();stickyHeader();dropDemoBar();topbar();shopCta();edgeToEdge();}
 if(document.readyState!=="loading"){run();}else{document.addEventListener("DOMContentLoaded",run);}
 window.addEventListener("load",edgeToEdge);
})();
</script>
