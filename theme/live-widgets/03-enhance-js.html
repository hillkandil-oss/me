<script>
(function(){
 function mk(tag,cls,txt,href){
  var e=document.createElement(tag);
  if(cls){e.className=cls;}
  if(txt){e.appendChild(document.createTextNode(txt));}
  if(href){e.setAttribute("href",href);}
  return e;
 }
 function topbar(){
  var mh=document.querySelector(".main-header");
  if(!mh||document.getElementById("kc-topbar")){return;}
  var bar=mk("div",null,null,null); bar.id="kc-topbar";
  var inner=mk("div","kc-topbar__inner",null,null);
  var tel=mk("a","kc-topbar__item kc-i-phone","Anrufen: +49 201 49869542","tel:+4920149869542");inner.appendChild(tel);
  inner.appendChild(mk("a","kc-topbar__item kc-i-mail","info@kaisercontainers.de","mailto:info@kaisercontainers.de"));
  inner.appendChild(mk("span","kc-topbar__item kc-i-clock","Mo–Sa: 08:00–18:30 Uhr",null));
  var dir=mk("a","kc-topbar__item kc-i-pin kc-sep","47138 Duisburg · Route planen","https://maps.app.goo.gl/k4JZCaARe1ZPu5WUA");
  dir.setAttribute("target","_blank"); dir.setAttribute("rel","noopener");
  inner.appendChild(dir);
  bar.appendChild(inner);
  mh.insertBefore(bar,mh.firstChild);
 }
 function shopCta(){
  var list=document.querySelectorAll(".main-header .theme-btn, a.theme-btn-eight");
  for(var i=0;i<list.length;i++){
   var a=list[i];
   var t=(a.textContent||"").toLowerCase();
   if(t.indexOf("sing up")>-1||t.indexOf("sign up")>-1||t.indexOf("sign in")>-1||a.getAttribute("href")==="#"){
    while(a.firstChild){a.removeChild(a.firstChild);}
    a.appendChild(document.createTextNode("Jetzt einkaufen"));
    a.setAttribute("href","/shop/");
   }
  }
 }
 function edgeToEdge(){
  var home=document.querySelector(".kc-home");
  if(!home){return;}
  var el=home.parentElement,guard=0;
  while(el&&el!==document.body&&guard<25){
   guard=guard+1;
   el.style.setProperty("max-width","none","important");
   el.style.setProperty("width","100%","important");
   el.style.setProperty("padding-left","0","important");
   el.style.setProperty("padding-right","0","important");
   el.style.setProperty("margin-left","0","important");
   el.style.setProperty("margin-right","0","important");
   el=el.parentElement;
  }
 }

 function dropDemoBar(){
  var sel=[".header-top-two",".header-top-one",".header-top"];
  for(var s=0;s<sel.length;s++){
   var n=document.querySelectorAll(sel[s]);
   for(var i=0;i<n.length;i++){ if(n[i].parentNode){ n[i].parentNode.removeChild(n[i]); } }
  }
 }

 function reveal(){
  if(!("IntersectionObserver" in window)){return;}
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){return;}
  var sels=[".kc-home section h2",".kc-home .kc-lead",".kc-cat",".kc-benefit",
            ".kc-home .kc-store-list",".kc-faq details",".woocommerce ul.products li.product",
            ".kc-home .kc-photo-slot",".kc-home form"];
  var groups={};
  for(var s=0;s<sels.length;s++){
   var n=document.querySelectorAll(sels[s]);
   for(var i=0;i<n.length;i++){
    if(n[i].classList.contains("kc-rv")){continue;}
    n[i].classList.add("kc-rv");
    var key=sels[s];
    groups[key]=(groups[key]||0)+1;
    n[i].style.setProperty("--d",((groups[key]-1)%6)*70+"ms");
   }
  }
  var io=new IntersectionObserver(function(entries){
   for(var e=0;e<entries.length;e++){
    if(entries[e].isIntersecting){entries[e].target.classList.add("is-in");io.unobserve(entries[e].target);}
   }
  },{threshold:0.12,rootMargin:"0px 0px -40px 0px"});
  var all=document.querySelectorAll(".kc-rv");
  for(var j=0;j<all.length;j++){io.observe(all[j]);}
 }
 function stickyHeader(){
  var mh=document.querySelector(".main-header");
  if(!mh){return;}
  function onScroll(){
   if(window.pageYOffset>240){mh.classList.add("kc-stuck");}else{mh.classList.remove("kc-stuck");}
  }
  window.addEventListener("scroll",onScroll,{passive:true});onScroll();
 }

 function germanForm(){
  var map={"your name":"Vollständiger Name (Pflichtfeld)","your email":"E-Mail-Adresse (Pflichtfeld)",
           "subject":"Betreff (Pflichtfeld)","your message (optional)":"Ihre Nachricht",
           "your message":"Ihre Nachricht"};
  var ph={"your-name":"Ihr vollst\u00e4ndiger Name","your-email":"ihre.adresse@firma.de",
          "your-subject":"Worum geht es?","your-message":"Wie können wir Ihnen helfen?"};
  var labels=document.querySelectorAll(".wpcf7-form label");
  for(var i=0;i<labels.length;i++){
   var lab=labels[i];
   for(var n=0;n<lab.childNodes.length;n++){
    var node=lab.childNodes[n];
    if(node.nodeType===3){
     var key=node.nodeValue.replace(/\s+/g," ").trim().toLowerCase();
     if(map[key]){node.nodeValue=map[key];}
    }
   }
  }
  for(var k in ph){
   var el=document.querySelector('.wpcf7-form [name="'+k+'"]');
   if(el&&!el.getAttribute("placeholder")){el.setAttribute("placeholder",ph[k]);}
  }
  var sub=document.querySelectorAll('.wpcf7-form input[type="submit"]');
  for(var s=0;s<sub.length;s++){
   if((sub[s].value||"").toLowerCase().indexOf("submit")>-1){sub[s].value="Nachricht senden";}
  }
 }
 function isProductPage(){
  return document.body && document.body.className.indexOf("single-product")>-1;
 }
 function productCondition(){
  var t=(document.body.textContent||"");
  if(t.indexOf("Gebraucht")>-1||t.indexOf("gebraucht")>-1){return "UsedCondition";}
  return "NewCondition";
 }
 /* Brief section 17: shipping, pickup, availability and returns on every product page */
 function productInfo(){
  if(!isProductPage()||document.querySelector(".kc-prod-info")){return;}
  var host=document.querySelector(".summary.entry-summary")||document.querySelector(".summary");
  if(!host){return;}
  function li(parent,txt){var e=document.createElement("li");e.appendChild(document.createTextNode(txt));parent.appendChild(e);return e;}
  function link(parent,txt,href){
   var a=document.createElement("a");a.setAttribute("href",href);
   a.appendChild(document.createTextNode(txt));parent.appendChild(a);
   parent.appendChild(document.createTextNode(" "));return a;}
  var box=document.createElement("div");box.className="kc-prod-info";
  var h=document.createElement("h3");
  h.appendChild(document.createTextNode("Versand, Abholung & Verfügbarkeit"));box.appendChild(h);
  var ul=document.createElement("ul");
  li(ul,"Online- und Ladenverfügbarkeit können abweichen. Bitte kontaktieren Sie uns vor einem Besuch, um die Verfügbarkeit zu bestätigen.");
  li(ul,"Bearbeitungszeit: 0–1 Werktage · Lieferung: 2–5 Werktage (deutschlandweit).");
  li(ul,"Abholung nach Absprache an unserem Standort in Duisburg.");
  li(ul,"Zahlung per Banküberweisung.");
  li(ul,"14 Tage gesetzliches Widerrufsrecht, zusätzlich 30 Tage freiwillige Rückgabe.");
  box.appendChild(ul);
  var p=document.createElement("p");p.className="kc-prod-info__links";
  link(p,"Versand & Lieferung","/versand/");
  link(p,"Widerruf & Rückgabe","/widerruf/");
  link(p,"Zahlung","/zahlung/");
  link(p,"Kontakt","/kontakt/");
  box.appendChild(p);
  host.appendChild(box);
 }

 function headerTools(){
  var host=document.querySelector(".main-header .outer-box")||document.querySelector(".main-header .header-lower");
  if(!host||document.querySelector(".kc-tools")){return;}
  var wrap=document.createElement("div"); wrap.className="kc-tools";
  var f=document.createElement("form");
  f.className="kc-search"; f.setAttribute("role","search");
  f.setAttribute("method","get"); f.setAttribute("action","/");
  var inp=document.createElement("input");
  inp.setAttribute("type","search"); inp.setAttribute("name","s");
  inp.setAttribute("placeholder","Container suchen \u2026");
  inp.setAttribute("aria-label","Container suchen");
  var pt=document.createElement("input");
  pt.setAttribute("type","hidden"); pt.setAttribute("name","post_type"); pt.setAttribute("value","product");
  var btn=document.createElement("button");
  btn.setAttribute("type","submit"); btn.className="kc-search__btn"; btn.setAttribute("aria-label","Suchen");
  f.appendChild(inp); f.appendChild(pt); f.appendChild(btn);
  var a=document.createElement("a");
  a.className="kc-cart"; a.setAttribute("href","/cart/"); a.setAttribute("aria-label","Warenkorb");
  var b=document.createElement("span");
  b.className="kc-cart__count"; b.setAttribute("data-count","0");
  a.appendChild(b);
  wrap.appendChild(f); wrap.appendChild(a);
  host.appendChild(wrap);
 }

 function readItemsInCart(){
  var all=document.cookie?document.cookie.split("; "):[];
  for(var i=0;i<all.length;i++){
   var kv=all[i].split("=");
   if(kv[0]==="woocommerce_items_in_cart"||kv[0]==="woocommerce_cart_items"){
    var n=parseInt(kv[1],10);
    if(!isNaN(n)){return n;}
   }
  }
  return 0;
 }
 function paintCart(){
  var badge=document.querySelector(".kc-cart__count");
  if(!badge){return;}
  var n=readItemsInCart();
  while(badge.firstChild){badge.removeChild(badge.firstChild);}
  badge.appendChild(document.createTextNode(String(n)));
  badge.setAttribute("data-count",String(n));
  var link=document.querySelector(".kc-cart");
  if(link){link.setAttribute("aria-label", n===1?"Warenkorb, 1 Artikel":("Warenkorb, "+n+" Artikel"));}
 }
 function watchCart(){
  paintCart();
  if(window.jQuery){
   window.jQuery(document.body).on("added_to_cart removed_from_cart updated_cart_totals wc_fragments_refreshed",function(){
    setTimeout(paintCart,120);
   });
  }
  window.addEventListener("pageshow",paintCart);
 }
 function run(){watchCart();headerTools();productInfo();germanForm();reveal();stickyHeader();dropDemoBar();topbar();shopCta();edgeToEdge();}
 if(document.readyState!=="loading"){run();}else{document.addEventListener("DOMContentLoaded",run);}
 window.addEventListener("load",edgeToEdge);
})();
</script>
